# Optional: a local Neo4j without installing Neo4j Desktop.
#   docker compose up -d
#   then in .env:  NEO4J_URI=bolt://localhost:7687  NEO4J_PASSWORD=movies-graph
#   python scripts/load_neo4j.py --verify
# Browser UI: http://localhost:7474
services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/movies-graph
    volumes:
      - neo4j-data:/data
volumes:
  neo4j-data:
